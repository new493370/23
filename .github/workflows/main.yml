name: Update Arista Configs Every 30 Min

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-all-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Random delay
      run: sleep $((RANDOM % 300 + 60))
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmaxminddb0 libmaxminddb-dev mmdb-bin
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 maxminddb geoip2
        
    - name: Setup GeoIP databases
      run: |
        mkdir -p geoip
        cat > /tmp/GeoIP.conf << EOF
        AccountID ${{ secrets.MAXMIND_ACCOUNT_ID }}
        LicenseKey ${{ secrets.MAXMIND_LICENSE_KEY }}
        EditionIDs GeoLite2-ASN GeoLite2-City GeoLite2-Country
        EOF
        geoipupdate -f /tmp/GeoIP.conf -d geoip/ || wget -q https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb -O geoip/GeoLite2-Country.mmdb
        rm -f /tmp/GeoIP.conf
        
    - name: Clean old config files
      run: |
        rm -rf configs/
        mkdir -p configs/telegram configs/github configs/combined configs/country
        
    - name: Run Telegram Config Extractor
      run: python telegram_extractor.py
      timeout-minutes: 20
        
    - name: Run GitHub Config Extractor
      run: python github_extractor.py
      timeout-minutes: 15
        
    - name: Combine Configs
      run: python combine_configs.py
        
    - name: Classify by Country
      run: python country_classifier.py
        
    - name: Create summary
      run: |
        date > last_update.txt
        echo "Updated: $(date -u '+%Y-%m-%d %H:%M UTC')" > update_info.txt
        python -c "
        import json, os
        if os.path.exists('configs/country/summary.json'):
            with open('configs/country/summary.json') as f: data = json.load(f)
            print(f'\n📊 COUNTRY SUMMARY ({len(data)} countries):')
            for country, info in sorted(data.items(), key=lambda x: x[1][\"total\"], reverse=True)[:10]:
                print(f'  {country}: {info[\"total\"]} configs')
        " >> update_info.txt
        
    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Stage all changes
      run: |
        git add configs/telegram/ configs/github/ configs/combined/ configs/country/ last_update.txt update_info.txt
        
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --cached --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Pull latest changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git pull --rebase origin main || true
        
    - name: Commit changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git commit -m "🔄 Configs update $(date -u '+%Y-%m-%d %H:%M UTC')"
        
    - name: Push changes with retry
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        max_retries=3
        retry_count=0
        until [ $retry_count -ge $max_retries ]
        do
          git pull --rebase origin main && git push origin main && break
          retry_count=$((retry_count+1))
          echo "Push failed, retry $retry_count/$max_retries..."
          sleep 5
        done
