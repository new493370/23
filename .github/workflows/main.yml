name: Update Arista Configs Every 30 Min

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-all-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Random delay
      run: sleep $((RANDOM % 300 + 60))
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Clean old config files
      run: |
        rm -rf configs/
        mkdir -p configs/telegram configs/github configs/combined
        
    - name: Run Telegram Config Extractor
      run: python telegram_extractor.py
      timeout-minutes: 20
        
    - name: Run GitHub Config Extractor
      run: python github_extractor.py
      timeout-minutes: 15
        
    - name: Combine Configs
      run: python combine_configs.py
        
    - name: Create summary
      run: |
        date > last_update.txt
        echo "Updated: $(date -u '+%Y-%m-%d %H:%M UTC')" > update_info.txt
        
    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Pull latest changes
      run: |
        git pull --rebase origin main
      continue-on-error: true
        
    - name: Stage all changes
      run: |
        git add .
        
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --cached --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git commit -m "🔄 Configs update $(date -u '+%Y-%m-%d %H:%M UTC')"
        
    - name: Push changes with retry
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        MAX_RETRIES=5
        RETRY_COUNT=0
        RETRY_DELAY=10
        
        until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
          git pull --rebase origin main && git push origin main && break
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "Push failed, retrying in $RETRY_DELAY seconds... (Attempt $RETRY_COUNT of $MAX_RETRIES)"
          sleep $RETRY_DELAY
          RETRY_DELAY=$((RETRY_DELAY * 2))
        done
        
    - name: Force push only if really necessary
      if: failure() && steps.check_changes.outputs.changes == 'true'
      run: |
        echo "⚠️ Attempting force push as last resort..."
        git fetch origin main
        git reset --soft origin/main
        git commit -m "🔄 Force update $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push --force-with-lease origin main
